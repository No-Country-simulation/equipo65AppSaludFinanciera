# Configuracion del servidor y de la base de datos.
#
# Este archivo estaba guardado en la codificacion por defecto de Windows
# (Windows-1252) y Maven abortaba al compilar en Linux con
# "MalformedInputException: Input length = 1": compilaba en las maquinas del
# equipo pero NO dentro de un contenedor. Ahora esta en UTF-8 y el pom fija
# project.build.sourceEncoding. Se mantiene en ASCII para no volver a depender
# de la codificacion.
#
# Los valores por defecto son los mismos de antes (H2 en memoria), para que
# `mvn spring-boot:run` siga funcionando sin nada montado. En contenedor,
# ops/compose.yml los sobreescribe por entorno y apunta a PostgreSQL.

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA / Hibernate.
#
# ⚠️ Contra PostgreSQL hay que pasar SPRING_JPA_HIBERNATE_DDL_AUTO=none: el
# esquema lo gobiernan las migraciones de db/, no Hibernate. Con "update",
# Hibernate crearia SUS PROPIAS tablas (usuarios, banco_transacciones, ...) al
# lado de las reales, porque las entidades no cubren el modelo de datos entero,
# y nadie se enteraria. Ver ../db/README.md.
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Consola de H2: http://localhost:8080/h2-console
#
# ⚠️ APAGADA por defecto (2026-08-20). Estaba en `true`, y como SecurityConfig
# deja `/h2-console/**` abierto, el servlet quedaba PUBLICADO en produccion:
# https://api.fintechvital.com/h2-console/ respondia 200. No era explotable
# -- H2 rechaza conexiones remotas si no se activa `webAllowOthers`, y responde
# "remote connections are disabled" -- pero es superficie que no pinta nada ahi:
# la base de produccion es PostgreSQL, la consola no sirve para nada, y bastaria
# activar esa unica opcion para convertirla en un cliente SQL abierto a internet
# DENTRO de la red privada, que es justo lo que el tunel evita.
#
# Para usarla en local: SPRING_H2_CONSOLE_ENABLED=true
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}

# CORS: origenes permitidos, separados por comas (ver config/CorsConfig.java).
# Es el ORIGEN completo (esquema + host + puerto), sin ruta ni barra final.
fv.cors.origins=${FV_CORS_ORIGINS:http://localhost:3000,https://staging.fintechvital.com,https://fintechvital.com,https://www.fintechvital.com}

# El JSON de la API va en snake_case (CONTRATO_API §1), aunque en Java sea
# camelCase. Se configura globalmente para no tener que anotar cada DTO.
spring.jackson.property-naming-strategy=SNAKE_CASE
# Los campos null no se serializan: una respuesta con "telefono": null solo
# anade ruido.
spring.jackson.default-property-inclusion=non_null

# --- JWT ---
# ⚠️ FV_JWT_SECRETO es OBLIGATORIO fuera de local: con el se firman los tokens,
# y quien lo tenga puede emitir sesiones de cualquier usuario. Generalo con:
#   openssl rand -base64 48
# El valor por defecto es solo para desarrollo y la aplicacion avisa si mide
# menos de 32 bytes.
fv.jwt.secreto=${FV_JWT_SECRETO:desarrollo-local-cambiar-en-despliegue-32bytes-minimo!!}
fv.jwt.ttl-access-segundos=${FV_JWT_TTL_ACCESS:900}
fv.jwt.ttl-refresh-segundos=${FV_JWT_TTL_REFRESH:604800}

# --- Servicio de modelo (ML) ---
# Se llama por NOMBRE DE SERVICIO dentro de la red del compose; el contenedor
# `ml` no publica puertos a la maquina a proposito (es interno).
# El valor por defecto apunta a localhost para poder levantarlo suelto en
# desarrollo; en contenedor, ops/compose.yml manda FV_ML_URL=http://ml:8000.
fv.ml.url=${FV_ML_URL:http://localhost:8000}
# Autenticacion entre servicios (CONTRATO_MODELO §3). Vacia = desactivada.
fv.clave-interna=${FV_CLAVE_INTERNA:}

# --- OpenAPI / Swagger ---
# El contrato pide la documentacion en /api/v1/docs, no en el /swagger-ui.html
# por defecto de springdoc.
springdoc.swagger-ui.path=/api/v1/docs
springdoc.api-docs.path=/api/v1/openapi.json
# Ordena las operaciones por metodo en vez de por orden de descubrimiento, que
# cambia entre arranques y hace que la pagina se vea distinta cada vez.
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- Idioma (ADR-0009) ---
# Los textos de recomendaciones, perfiles y categorias viven en
# src/main/resources/mensajes_{es,pt,en}.properties. UTF-8 es obligatorio: sin
# esto los acentos de "Alimentacion" o "Saude" salen rotos.
spring.messages.basename=mensajes
spring.messages.encoding=UTF-8
