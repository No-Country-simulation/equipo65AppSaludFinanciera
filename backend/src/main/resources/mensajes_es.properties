# Textos en espanol (idioma por defecto).
#
# El motor de reglas NUNCA devuelve una frase: devuelve un `codigo` + `parametros`
# y el texto se arma aqui, con el Accept-Language de la peticion. Asi anadir un
# idioma no obliga a tocar la logica de negocio, y el historial de analisis
# guardado (que solo persiste el codigo) se puede releer en otro idioma.
#
# Los marcadores son {categoria} y {pct}, con nombre y no {0}: se sustituyen a
# mano en MotorReglasService, no con MessageFormat. MessageFormat trata la
# comilla simple como caracter de escape, asi que "l'analyse" o "d'entree" se
# romperian en silencio al anadir frances.
#
# ⚠️ Este archivo va en UTF-8 (lo declara I18nConfig). Lleva acentos a proposito:
# son etiquetas que ve el usuario, no identificadores.

# --- Perfiles (TAXONOMIA §2) ---
perfil.saludable=Saludable
perfil.en_observacion=En observación
perfil.en_riesgo=En riesgo

# --- Categorias (TAXONOMIA §1.1) ---
categoria.alimentacion=Alimentación
categoria.transporte=Transporte
categoria.vivienda=Vivienda
categoria.servicios=Servicios
categoria.salud=Salud
categoria.educacion=Educación
categoria.entretenimiento=Entretenimiento
categoria.compras=Compras
categoria.finanzas=Finanzas
categoria.ahorro_inversion=Ahorro e inversión
categoria.ingresos=Ingresos
categoria.otros=Otros

# --- Recomendaciones (TAXONOMIA §4) ---
rec.REC_DATOS_PARCIALES=Los gastos registrados cubren solo el {pct}% de tu ingreso: carga más transacciones para un análisis más preciso
rec.REC_DEFICIT=Tus gastos superan tus ingresos: revisa los gastos no esenciales este mes
rec.REC_DEUDA_ALTA=Tu nivel de endeudamiento es alto: prioriza reducir la deuda antes de nuevos gastos
rec.REC_AHORRO_BAJO=Aumentar la reserva financiera mensual
rec.REC_SIN_AHORRO=Establecer un ahorro automático mensual, aunque sea un monto pequeño
rec.REC_ESENCIAL_ALTO=Tus gastos esenciales consumen más del 60% de tu ingreso: hay poco margen ante un imprevisto
rec.REC_DISCRECIONAL_ALTO=Reducir los gastos en entretenimiento y compras liberaría margen de ahorro
rec.REC_CONCENTRACION=Más de la mitad de tu gasto está en la categoría {categoria}: revisa si es sostenible
rec.REC_RECURRENTE_ALTO=Monitorear los gastos recurrentes de entretenimiento
rec.REC_CATEGORIA_EXCESO=Reducir los gastos en {categoria}
rec.REC_CONSOLIDA=Buen manejo: considera invertir el excedente en lugar de dejarlo inmovilizado
